<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Appliance Cards – tests</title><style>body{font:14px system-ui,sans-serif;background:#111;color:#ddd;margin:16px}#g{position:absolute;left:-9999px;width:480px}table{border-collapse:collapse;width:100%;max-width:900px}td{padding:4px 8px;border-top:1px solid #333}.p{color:#3ddc84}.f{color:#ff6b6b}h1{font-size:18px}</style></head><body><h1>Appliance Cards — tests automatiques</h1><p id="sum">…</p><table id="res"></table>
<div id="g"></div>
<script>
customElements.define('ha-card', class extends HTMLElement{});
customElements.define('ha-icon', class extends HTMLElement{});
window.__errors=[]; window.addEventListener('error',e=>__errors.push(e.message));
</script>
<script src="../dist/ha-appliance-electromenager-cards.js"></script>
<script>
const R=[]; const ok=(name,cond,info='')=>R.push({name,pass:!!cond,info:cond?'':String(info)});
const now=new Date().toISOString();
const mk=(id,state,attrs={})=>({entity_id:id,state:String(state),attributes:attrs,last_changed:now});
const W={unit_of_measurement:'W',device_class:'power'}, T={unit_of_measurement:'°C',device_class:'temperature'};
function hassOf(states,lang='fr'){const S={};states.forEach(s=>S[s.entity_id]=s);return{states:S,language:lang,locale:{language:lang},config:{},calls:[],callService(d,s,data){this.calls.push([d,s,data]);}};}
function card(kind,cfg,states,lang){const el=document.createElement(`appliance-${kind}-card`);el.setConfig(cfg);document.getElementById('g').appendChild(el);const h=hassOf(states,lang);el.hass=h;return {el,h,sr:el.shadowRoot,wrap:el.shadowRoot.getElementById('wrap'),txt:()=>el.shadowRoot.getElementById('info').textContent.replace(/\s+/g,' ').trim(),lcd:()=>el.shadowRoot.querySelector('.lcd')?.textContent};}
const has=(c,cls)=>c.wrap.classList.contains(cls);

// registration
const tags=['washer','dryer','dishwasher','water-heater','oven','microwave','fridge','pellet-stove','pool-pump','printer-3d','chest-freezer','drawer-freezer','solar','vmc','hob','radiator','air-fryer','coffee-maker','tv','range-hood','ac-split','heat-pump','towel-dryer','server-rack','desktop-pc','laptop','wine-cooler'];
tags.forEach(t=>ok(`registered ${t}`,customElements.get(`appliance-${t}-card`)));
// card picker: every core card and every self-contained card listed exactly once
const solo=['aquarium','linky','battery','ev-charger','robot-vacuum-solo','robot-mower-solo','pellet-boiler','gas-boiler','water-heat-pump'];
solo.forEach(t=>ok(`registered ${t}`,customElements.get(`appliance-${t}-card`)));
const picked=window.customCards.map(c=>c.type), wanted=[...tags,...solo].map(t=>`appliance-${t}-card`);
ok(`customCards = ${wanted.length}`,picked.length===wanted.length&&wanted.every(t=>picked.filter(p=>p===t).length===1),
  [...wanted.filter(t=>!picked.includes(t)).map(t=>`missing ${t}`),...picked.filter(t=>!wanted.includes(t)).map(t=>`extra ${t}`),`${picked.length} entries`].join(', '));
// config validation
try{document.createElement('appliance-washer-card').setConfig({});ok('empty config throws',false)}catch(e){ok('empty config throws',/entity|power/.test(e.message),e.message)}

// washer state matrix
const wcases=[
 ['input_boolean off -> idle',{entity:'input_boolean.w'},[mk('input_boolean.w','off')],'st-idle','OFF'],
 ['input_boolean on -> running/wash',{entity:'input_boolean.w'},[mk('input_boolean.w','on')],'ph-wash','WASH'],
 ['plug on + low power -> standby',{entity:'switch.w',power:'sensor.p'},[mk('switch.w','on'),mk('sensor.p',2,W)],'st-standby','OFF'],
 ['plug on + high power -> running',{entity:'switch.w',power:'sensor.p'},[mk('switch.w','on'),mk('sensor.p',1500,W)],'st-running','WASH'],
 ['plug off -> off',{entity:'switch.w',power:'sensor.p'},[mk('switch.w','off'),mk('sensor.p',0,W)],'st-off','OFF'],
 ['power only 0 -> idle',{power:'sensor.p'},[mk('sensor.p',0,W)],'st-idle','OFF'],
 ['power kW unit -> running',{power:'sensor.p'},[mk('sensor.p',1.2,{unit_of_measurement:'kW',device_class:'power'})],'st-running','WASH'],
 ['sensor Rinçage -> rinse',{entity:'sensor.s'},[mk('sensor.s','Rinçage')],'ph-rinse','RINSE'],
 ['sensor spin -> spin',{entity:'sensor.s'},[mk('sensor.s','spin')],'ph-spin','SPIN'],
 ['program Essorage -> spin',{entity:'sensor.s',program:'sensor.prog'},[mk('sensor.s','running'),mk('sensor.prog','Essorage 1200')],'ph-spin','SPIN'],
 ['finished -> END',{entity:'sensor.s'},[mk('sensor.s','finished')],'st-finished','END'],
 ['finished but power high -> running',{entity:'sensor.s',power:'sensor.p'},[mk('sensor.s','finished'),mk('sensor.p',900,W)],'st-running','WASH'],
 ['unavailable -> st-unavailable',{entity:'sensor.s'},[mk('sensor.s','unavailable')],'st-unavailable','- - -'],
 ['missing entity -> unavailable',{entity:'sensor.nope'},[],'st-unavailable','- - -'],['power sensor unavailable -> unavailable',{power:'sensor.p'},[mk('sensor.p','unavailable')],'st-unavailable','- - -'],
];
for(const [n,cfg,st,cls,l] of wcases){try{const c=card('washer',cfg,st);if(cls)ok(`washer: ${n}`,has(c,cls),c.wrap.className);if(l)ok(`washer LCD: ${n}`,c.lcd()===l,c.lcd());if(!cls)ok(`washer: ${n}`,true)}catch(e){ok(`washer: ${n}`,false,e.message)}}

// remaining formats
const rcases=[['47 min',[mk('sensor.r',47,{unit_of_measurement:'min'})],'0:47','47 min'],['H:MM:SS',[mk('sensor.r','1:05:00')],'1:05','1 h 05'],['seconds',[mk('sensor.r',90,{unit_of_measurement:'s'})],'0:02','2 min'],
 ['timestamp',[mk('sensor.r',new Date(Date.now()+30*60000).toISOString(),{device_class:'timestamp'})],'0:30','30 min'],['hours',[mk('sensor.r',2,{unit_of_measurement:'h'})],'2:00','2 h']];
for(const [n,st,l,tile] of rcases){const c=card('washer',{entity:'input_boolean.w',remaining:'sensor.r'},[mk('input_boolean.w','on'),...st]);
 ok(`remaining ${n} LCD`,c.lcd()===l,c.lcd()); ok(`remaining ${n} tile`,c.sr.getElementById('stats').textContent.includes(tile),c.sr.getElementById('stats').textContent); ok(`remaining ${n} ends_at`,/Fin à/.test(c.txt()),c.txt());}

// dryer / dishwasher
let c=card('dryer',{entity:'binary_sensor.d'},[mk('binary_sensor.d','on')]); ok('dryer on -> ph-dry + DRY',has(c,'ph-dry')&&c.lcd()==='DRY',c.wrap.className+' '+c.lcd());
c=card('dryer',{entity:'sensor.d'},[mk('sensor.d','Refroidissement')]); ok('dryer cooling phase',has(c,'ph-cool'),c.wrap.className);
c=card('dishwasher',{entity:'sensor.d'},[mk('sensor.d','Séchage')]); ok('dishwasher drying phase',has(c,'ph-dry'),c.wrap.className);
c=card('dishwasher',{entity:'sensor.d'},[mk('sensor.d','running')]); ok('dishwasher wash phase',has(c,'ph-wash'),c.wrap.className);

// water heater
c=card('water-heater',{switch:'switch.h',power:'sensor.p',temperature:'sensor.t',target_temperature:'sensor.c'},[mk('switch.h','on'),mk('sensor.p',2400,W),mk('sensor.t',45,T),mk('sensor.c',60,T)]);
ok('water heater heating',has(c,'st-heating'),c.wrap.className);
ok('water heater needle rotated',/rotate\(/.test(c.sr.querySelector('.needle').getAttribute('transform')||''));
ok('water heater gauge text 45°',c.sr.querySelector('.gauge-txt').textContent==='45°',c.sr.querySelector('.gauge-txt').textContent);
ok('water heater progress bar visible',c.sr.getElementById('bar').style.display!=='none');
c=card('water-heater',{switch:'switch.h',power:'sensor.p'},[mk('switch.h','on'),mk('sensor.p',0,W)]); ok('water heater ready',has(c,'st-ready'),c.wrap.className);
c=card('water-heater',{switch:'switch.h'},[mk('switch.h','off')]); ok('water heater off',has(c,'st-off'),c.wrap.className);
c=card('water-heater',{entity:'water_heater.x'},[mk('water_heater.x','eco',{current_temperature:55,temperature:60})]); ok('water_heater entity attrs used',c.sr.querySelector('.gauge-txt').textContent==='55°',c.sr.querySelector('.gauge-txt').textContent);

// oven
c=card('oven',{switch:'switch.o',power:'sensor.p',temperature:'sensor.t',target_temperature:'sensor.c'},[mk('switch.o','on'),mk('sensor.p',2500,W),mk('sensor.t',120,T),mk('sensor.c',200,T)]);
ok('oven preheating',has(c,'st-preheating'),c.wrap.className); ok('oven LCD temp',c.lcd()==='120°',c.lcd());
c=card('oven',{switch:'switch.o',power:'sensor.p',temperature:'sensor.t',target_temperature:'sensor.c'},[mk('switch.o','on'),mk('sensor.p',2500,W),mk('sensor.t',198,T),mk('sensor.c',200,T)]);
ok('oven heating at temp',has(c,'st-heating'),c.wrap.className);
c=card('oven',{power:'sensor.p'},[mk('sensor.p',0,W)]); ok('oven off shows clock',/\d{1,2}:\d{2}/.test(c.lcd()),c.lcd());

// microwave
c=card('microwave',{power:'sensor.p',remaining:'sensor.r'},[mk('sensor.p',900,W),mk('sensor.r','0:01:45')]); ok('microwave running countdown',has(c,'active')&&c.lcd()==='1:45',c.lcd());
c=card('microwave',{power:'sensor.p',door:'binary_sensor.d'},[mk('sensor.p',0,W),mk('binary_sensor.d','on')]); ok('microwave door alert',has(c,'alert')&&/Porte ouverte/.test(c.txt()),c.txt());

// air fryer
c=card('air-fryer',{power:'sensor.p',remaining:'sensor.r'},[mk('sensor.p',1700,W),mk('sensor.r','0:12:00')]); ok('air fryer cooking countdown',has(c,'st-cooking')&&has(c,'active')&&c.lcd()==='12:00',c.wrap.className+' '+c.lcd());
ok('air fryer status text Cuisson',/Cuisson/.test(c.txt()),c.txt());
c=card('air-fryer',{power:'sensor.p',temperature:'sensor.t'},[mk('sensor.p',1500,W),mk('sensor.t',200,T)]); ok('air fryer LCD temp',c.lcd()==='200°',c.lcd());
c=card('air-fryer',{entity:'switch.af',power:'sensor.p'},[mk('switch.af','on'),mk('sensor.p',2,W)]); ok('air fryer plug on low power -> idle',has(c,'st-idle')&&c.lcd()==='OFF',c.wrap.className+' '+c.lcd());
c=card('air-fryer',{entity:'switch.af',power:'sensor.p'},[mk('switch.af','off'),mk('sensor.p',0,W)]); ok('air fryer off',has(c,'st-off'),c.wrap.className);
c=card('air-fryer',{entity:'sensor.s'},[mk('sensor.s','finished')]); ok('air fryer finished End',has(c,'st-finished')&&c.lcd()==='End',c.lcd());

// coffee maker
c=card('coffee-maker',{entity:'switch.cf',power:'sensor.p'},[mk('switch.cf','on'),mk('sensor.p',950,W)]); ok('coffee brewing',has(c,'st-brewing')&&has(c,'active')&&c.lcd()==='CAFE',c.wrap.className+' '+c.lcd());
ok('coffee status text',/Préparation du café/.test(c.txt()),c.txt());
c=card('coffee-maker',{entity:'switch.cf',power:'sensor.p'},[mk('switch.cf','on'),mk('sensor.p',70,W)]); ok('coffee filtre keep warm',has(c,'st-keep_warm')&&/Maintien au chaud/.test(c.txt()),c.wrap.className);
c=card('coffee-maker',{entity:'switch.cf',power:'sensor.p',style:'dosette'},[mk('switch.cf','on'),mk('sensor.p',70,W)]); ok('coffee pod ready',has(c,'st-ready')&&c.sr.querySelector('.s-dosette'),c.wrap.className);
c=card('coffee-maker',{power:'sensor.p',style:'espresso'},[mk('sensor.p',1,W)]); ok('coffee espresso idle + svg',has(c,'st-idle')&&c.sr.querySelector('.s-expresso'),c.wrap.className);
c=card('coffee-maker',{entity:'switch.cf',power:'sensor.p'},[mk('switch.cf','off'),mk('sensor.p',0,W)]); ok('coffee off',has(c,'st-off')&&c.lcd()==='OFF',c.wrap.className+' '+c.lcd());

// tv
c=card('tv',{entity:'switch.tv',power:'sensor.p'},[mk('switch.tv','on'),mk('sensor.p',85,W)]); ok('tv on',has(c,'st-screen_on')&&/Allumée/.test(c.txt()),c.wrap.className+' '+c.txt());
c=card('tv',{entity:'switch.tv',power:'sensor.p'},[mk('switch.tv','on'),mk('sensor.p',0.5,W)]); ok('tv standby',has(c,'st-standby')&&/Veille/.test(c.txt()),c.wrap.className);
c=card('tv',{entity:'switch.tv',power:'sensor.p'},[mk('switch.tv','off'),mk('sensor.p',0,W)]); ok('tv off',has(c,'st-off'),c.wrap.className);
c=card('tv',{entity:'media_player.tv'},[mk('media_player.tv','playing',{app_name:'Netflix'})]); ok('tv media_player playing + app',has(c,'st-screen_on')&&/Netflix/.test(c.txt()),c.txt());
c=card('tv',{entity:'media_player.tv'},[mk('media_player.tv','off')]); ok('tv media_player off',has(c,'st-off'),c.wrap.className);
// water heater: grid power + solar router power
c=card('water-heater',{power:'sensor.g',power_solar:'sensor.s',energy:'sensor.eg',energy_solar:'sensor.es'},[mk('sensor.g',0,W),mk('sensor.s',1200,W),mk('sensor.eg',2,{unit_of_measurement:'kWh'}),mk('sensor.es',3,{unit_of_measurement:'kWh'})]); ok('water heater solar only -> heating + solar-heat',has(c,'st-heating')&&has(c,'solar-heat')&&/Surplus solaire/.test(c.txt()),c.wrap.className+' '+c.txt());
ok('water heater dual tiles',/Réseau/.test(c.sr.getElementById('stats').textContent)&&/Énergie solaire/.test(c.sr.getElementById('stats').textContent),c.sr.getElementById('stats').textContent);
c=card('water-heater',{power:'sensor.g',power_solar:'sensor.s'},[mk('sensor.g',2000,W),mk('sensor.s',0,W)]); ok('water heater grid only -> heating, no solar-heat',has(c,'st-heating')&&!has(c,'solar-heat'),c.wrap.className);
c=card('water-heater',{power:'sensor.g',power_solar:'sensor.s'},[mk('sensor.g',0,W),mk('sensor.s',0,W)]); ok('water heater both 0 -> not heating',!has(c,'st-heating'),c.wrap.className);
// modes: comfort / eco / frost / off (radiator + towel dryer)
const SELM=(v)=>mk('select.mode',v,{options:['Confort','Eco','Hors-gel','Arrêt']});
c=card('towel-dryer',{power:'sensor.p',mode:'select.mode'},[mk('sensor.p',500,W),SELM('Eco')]); ok('towel dryer mode eco',has(c,'mode-eco')&&/Éco/.test(c.txt()),c.wrap.className+' '+c.txt());
ok('towel dryer 4 mode buttons, eco active',c.sr.querySelectorAll('.mode-btn').length===4&&c.sr.querySelector('.mode-btn.on')?.dataset.mode==='eco',c.sr.getElementById('modes').innerHTML.slice(0,200));
c.sr.querySelector('.mode-btn[data-mode=frost]').click(); ok('click frost -> select_option Hors-gel',c.h.calls.some(x=>x[0]==='select'&&x[1]==='select_option'&&x[2].option==='Hors-gel'),JSON.stringify(c.h.calls));
c=card('towel-dryer',{power:'sensor.p',mode:'select.mode'},[mk('sensor.p',0,W),SELM('Arrêt')]); ok('towel dryer mode off',has(c,'st-off'),c.wrap.className);
c=card('towel-dryer',{power:'sensor.p',mode:'select.mode'},[mk('sensor.p',0,W),SELM('Hors-gel')]); ok('towel dryer frost lcd H-G',c.lcd()==='H-G',c.lcd());
c=card('radiator',{power:'sensor.p',mode:'select.mode'},[mk('sensor.p',900,W),SELM('Confort')]); ok('radiator mode buttons',c.sr.querySelectorAll('.mode-btn').length===4&&c.sr.querySelector('.mode-btn.on')?.dataset.mode==='comfort',c.wrap.className);
c.sr.querySelector('.mode-btn[data-mode=off]').click(); ok('radiator click off -> select_option Arrêt',c.h.calls.some(x=>x[2]&&x[2].option==='Arrêt'),JSON.stringify(c.h.calls));
c=card('radiator',{entity:'climate.r'},[mk('climate.r','heat',{preset_modes:['comfort','eco','away'],hvac_modes:['off','heat'],preset_mode:'eco'})]); ok('radiator climate buttons from presets',c.sr.querySelectorAll('.mode-btn').length===4&&c.sr.querySelector('.mode-btn.on')?.dataset.mode==='eco',c.sr.getElementById('modes').innerHTML.slice(0,200));
c.sr.querySelector('.mode-btn[data-mode=comfort]').click(); ok('climate click comfort -> set_preset_mode',c.h.calls.some(x=>x[1]==='set_preset_mode'&&x[2].preset_mode==='comfort'),JSON.stringify(c.h.calls));
c=card('radiator',{power:'sensor.p',mode:'select.mode',show_modes:false},[mk('sensor.p',900,W),SELM('Confort')]); ok('show_modes:false hides buttons',c.sr.querySelectorAll('.mode-btn').length===0);
// wine cooler
c=card('wine-cooler',{power:'sensor.p',temperature:'sensor.t'},[mk('sensor.p',70,W),mk('sensor.t',12,T)]); ok('wine cooler cooling + lcd',has(c,'st-cooling')&&c.lcd()==='12°',c.wrap.className+' '+c.lcd());
c=card('wine-cooler',{power:'sensor.p'},[mk('sensor.p',2,W)]); ok('wine cooler standby',has(c,'st-standby'),c.wrap.className);
c=card('wine-cooler',{power:'sensor.p'},[mk('sensor.p',0,W)]); ok('wine cooler off/standby low',has(c,'st-standby')||has(c,'st-off'),c.wrap.className);
c=card('wine-cooler',{power:'sensor.p',temperature:'sensor.t'},[mk('sensor.p',70,W),mk('sensor.t',21,T)]); ok('wine cooler too warm alert',has(c,'warm'),c.wrap.className);
c=card('wine-cooler',{power:'sensor.p',door:'binary_sensor.d'},[mk('sensor.p',70,W),mk('binary_sensor.d','on')]); ok('wine cooler door open',has(c,'door-open')&&/Porte ouverte/.test(c.txt()),c.wrap.className+' '+c.txt());
// towel dryer / server rack / desktop pc / laptop
c=card('towel-dryer',{power:'sensor.p'},[mk('sensor.p',500,W)]); ok('towel dryer heating',has(c,'st-heating')&&has(c,'active'),c.wrap.className);
c=card('towel-dryer',{switch:'switch.t',power:'sensor.p'},[mk('switch.t','on'),mk('sensor.p',1,W)]); ok('towel dryer at target',has(c,'st-at_target'),c.wrap.className);
c=card('towel-dryer',{switch:'switch.t',power:'sensor.p'},[mk('switch.t','off'),mk('sensor.p',0,W)]); ok('towel dryer off',has(c,'st-off'),c.wrap.className);
c=card('towel-dryer',{power:'sensor.p',target_temperature:'sensor.tg'},[mk('sensor.p',500,W),mk('sensor.tg',22,T)]); ok('towel dryer lcd target',c.lcd()==='22°',c.lcd());
c=card('server-rack',{power:'sensor.p',max_power:200},[mk('sensor.p',100,W)]); ok('rack online + lcd + load',has(c,'st-online')&&c.lcd()==='100W'&&c.wrap.style.getPropertyValue('--load')==='0.50',c.wrap.className+' '+c.lcd());
c=card('server-rack',{power:'sensor.p'},[mk('sensor.p',10,W)]); ok('rack standby',has(c,'st-standby'),c.wrap.className);
c=card('server-rack',{power:'sensor.p'},[mk('sensor.p',0,W)]); ok('rack off',has(c,'st-off'),c.wrap.className);
c=card('desktop-pc',{power:'sensor.p'},[mk('sensor.p',120,W)]); ok('pc screen on',has(c,'st-screen_on')&&/Allumée/.test(c.txt()),c.wrap.className+' '+c.txt());
c=card('desktop-pc',{power:'sensor.p'},[mk('sensor.p',2,W)]); ok('pc sleep',has(c,'st-standby'),c.wrap.className);
c=card('desktop-pc',{power:'sensor.p'},[mk('sensor.p',0,W)]); ok('pc off',has(c,'st-off'),c.wrap.className);
c=card('laptop',{power:'sensor.p'},[mk('sensor.p',45,W)]); ok('laptop screen on',has(c,'st-screen_on'),c.wrap.className);
c=card('laptop',{power:'sensor.p'},[mk('sensor.p',5,W)]); ok('laptop sleep',has(c,'st-standby'),c.wrap.className);
c=card('laptop',{power:'sensor.p'},[mk('sensor.p',0,W)]); ok('laptop off',has(c,'st-off'),c.wrap.className);
// range hood
c=card('range-hood',{power:'sensor.p'},[mk('sensor.p',80,W)]); ok('hood speed1 + lights',has(c,'st-speed1')&&has(c,'lights-on'),c.wrap.className);
c=card('range-hood',{power:'sensor.p'},[mk('sensor.p',220,W)]); ok('hood speed2',has(c,'st-speed2')&&/Grande vitesse/.test(c.txt()),c.wrap.className);
c=card('range-hood',{power:'sensor.p'},[mk('sensor.p',8,W)]); ok('hood lights only',has(c,'st-lights')&&has(c,'lights-on')&&/Éclairage/.test(c.txt()),c.wrap.className+' '+c.txt());
c=card('range-hood',{power:'sensor.p',light:'light.hotte'},[mk('sensor.p',80,W),mk('light.hotte','off')]); ok('hood light entity off',has(c,'st-speed1')&&!has(c,'lights-on'),c.wrap.className);
c=card('range-hood',{power:'sensor.p'},[mk('sensor.p',0,W)]); ok('hood off',has(c,'st-off'),c.wrap.className);

// air conditioning
const CL=(st,act,extra={})=>mk('climate.c',st,Object.assign({hvac_action:act,current_temperature:26,temperature:22},extra));
c=card('ac-split',{entity:'climate.c'},[CL('cool','cooling')]); ok('split cooling + lcd target',has(c,'st-cooling')&&c.lcd()==='22°'&&has(c,'mode-cool'),c.wrap.className+' '+c.lcd());
c=card('ac-split',{entity:'climate.c'},[CL('heat','heating')]); ok('split heating',has(c,'st-heating')&&/En chauffe/.test(c.txt()),c.wrap.className);
c=card('ac-split',{entity:'climate.c'},[CL('cool','idle')]); ok('split at target',has(c,'st-at_target')&&/Consigne atteinte/.test(c.txt()),c.txt());
c=card('ac-split',{entity:'climate.c'},[CL('dry','drying')]); ok('split dry',has(c,'st-ac_dry'),c.wrap.className);
c=card('ac-split',{entity:'climate.c'},[CL('fan_only','fan')]); ok('split fan',has(c,'st-ac_fan')&&/Ventilation/.test(c.txt()),c.txt());
c=card('ac-split',{entity:'climate.c'},[CL('off','off')]); ok('split off',has(c,'st-off')&&c.lcd()==='',c.wrap.className);
c=card('ac-split',{power:'sensor.p',hvac:'cool'},[mk('sensor.p',900,W)]); ok('split plug cooling',has(c,'st-cooling'),c.wrap.className);
c=card('ac-split',{entity:'climate.c',power:'sensor.p'},[mk('climate.c','cool',{current_temperature:23,temperature:22}),mk('sensor.p',20,W)]); ok('split no action, low power -> at target',has(c,'st-at_target'),c.wrap.className);
c=card('heat-pump',{entity:'climate.c'},[CL('heat','heating')]); ok('pac heating',has(c,'st-heating'),c.wrap.className);
c=card('heat-pump',{entity:'climate.c'},[CL('heat','defrosting')]); ok('pac defrost',has(c,'st-defrost')&&/Dégivrage/.test(c.txt()),c.txt());
c=card('heat-pump',{power:'sensor.p'},[mk('sensor.p',5,W)]); ok('pac off',has(c,'st-off'),c.wrap.className);

// fridge
c=card('fridge',{power:'sensor.p',temperature:'sensor.t',freezer_temperature:'sensor.f'},[mk('sensor.p',90,W),mk('sensor.t',4,T),mk('sensor.f',-18,T)]);
