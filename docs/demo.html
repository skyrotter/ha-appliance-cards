<html lang="fr">
<head>
<meta charset="utf-8">

<script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
<style>
:root {
  --primary-color:#03a9f4; --error-color:#db4437; --success-color:#43a047; --disabled-text-color:#8a8a8a;
  --primary-text-color:#e6e6e6; --secondary-text-color:#9da3aa; --card-background-color:#1c1f23;
  --page-bg:#111315; --panel-bg:#181b1f; --line:rgba(127,127,127,.22);
}
body.light {
  --primary-text-color:#1d2125; --secondary-text-color:#68707a; --card-background-color:#ffffff;
  --page-bg:#eef0f3; --panel-bg:#f7f8fa;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--page-bg); color:var(--primary-text-color); font:14px/1.45 Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; }
header { position:sticky; top:0; z-index:5; background:var(--page-bg); border-bottom:1px solid var(--line); padding:12px 16px; display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; }
header h1 { font-size:17px; margin:0; font-weight:600; flex:1 1 220px; }
header h1 small { display:block; font-size:12px; font-weight:400; color:var(--secondary-text-color); }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
.seg button { background:none; border:0; color:var(--secondary-text-color); padding:6px 11px; font:inherit; cursor:pointer; }
.seg button.on { background:var(--primary-color); color:#fff; }
header a { color:var(--primary-color); text-decoration:none; font-size:13px; }
main { padding:16px; display:grid; gap:16px; grid-template-columns:repeat(auto-fill, minmax(min(100%, 360px), 1fr)); max-width:1600px; margin:0 auto; }
.cell { display:flex; flex-direction:column; gap:10px; }
ha-card { display:block; background:var(--card-background-color); border-radius:12px; border:1px solid var(--line); }
.ctl { background:var(--panel-bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; display:grid; grid-template-columns:auto 1fr auto; gap:6px 10px; align-items:center; font-size:13px; }
.ctl h3 { grid-column:1/-1; margin:0 0 2px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--secondary-text-color); font-weight:600; }
.ctl label { color:var(--secondary-text-color); white-space:nowrap; }
.ctl output { font-variant-numeric:tabular-nums; min-width:62px; text-align:right; }
.ctl select, .ctl input[type=range] { width:100%; min-width:0; }
.ctl select { background:var(--card-background-color); color:var(--primary-text-color); border:1px solid var(--line); border-radius:6px; padding:4px 6px; font:inherit; }
.ctl .chk { grid-column:2/-1; display:flex; gap:14px; flex-wrap:wrap; }
.ctl .chk label { color:var(--primary-text-color); display:flex; gap:5px; align-items:center; }
details.yaml { grid-column:1/-1; }
details.yaml summary { cursor:pointer; color:var(--secondary-text-color); font-size:12px; }
details.yaml pre { margin:6px 0 0; font-size:11.5px; background:var(--card-background-color); border:1px solid var(--line); border-radius:6px; padding:8px; overflow:auto; }
#log { position:fixed; right:16px; bottom:16px; width:min(340px, calc(100vw - 32px)); max-height:180px; overflow:auto; background:var(--panel-bg); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:12px; box-shadow:0 6px 24px rgba(0,0,0,.25); }
#log b { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--secondary-text-color); margin-bottom:4px; }
#log div { padding:2px 0; border-top:1px solid var(--line); font-family:ui-monospace, monospace; }
footer { text-align:center; color:var(--secondary-text-color); font-size:12px; padding:8px 16px 220px; }
</style>
</head>

<script>
/* Minimal stand-ins for Home Assistant's own elements */
customElements.define('ha-card', class extends HTMLElement {});
customElements.define('ha-icon', class extends HTMLElement {
  static get observedAttributes() { return ['icon']; }
  connectedCallback() { this.render(); }
  attributeChangedCallback() { this.render(); }
  render() {
    const s = getComputedStyle(this).getPropertyValue('--mdc-icon-size').trim() || '24px';
    this.style.display = 'inline-flex'; this.style.width = s; this.style.height = s;
    this.innerHTML = `<iconify-icon icon="${this.getAttribute('icon') || ''}" width="${s}" height="${s}"></iconify-icon>`;
  }
});
</script>
<script src="../dist/ha-appliance-electromenager-cards.js"></script>
<script>
const W = { unit_of_measurement: 'W', device_class: 'power' };
const T = { unit_of_measurement: '°C', device_class: 'temperature' };
const KWH = { unit_of_measurement: 'kWh', device_class: 'energy' };
const EUR = { unit_of_measurement: '€' };
const states = {};
const set = (id, state, attrs) => { states[id] = { entity_id: id, state: String(state), attributes: attrs || states[id]?.attributes || {}, last_changed: new Date().toISOString() }; };
let lang = 'fr', animations = true;
const cards = [];
const log = (msg) => { const d = document.createElement('div'); d.textContent = `${new Date().toLocaleTimeString()} ${msg}`; document.getElementById('log').insertBefore(d, document.getElementById('log').children[1]); };

const hass = () => ({
  states: { ...states }, language: lang, locale: { language: lang }, config: {},
  callService(domain, service, data) {
    log(`callService ${domain}.${service} ${data.entity_id}`);
    const cur = states[data.entity_id];
    if (cur && service === 'toggle') { set(data.entity_id, cur.state === 'on' ? 'off' : 'on'); refresh(); }
    if (cur && service === 'select_option') { const at = cur.attributes; set(data.entity_id, data.option); states[data.entity_id].attributes = at; if (cur._input) cur._input.value = data.option; refresh(); }
    // robots : les boutons Démarrer / Pause / Base changent l'état simulé
    const robot = { start: 'cleaning', start_mowing: 'mowing', pause: 'paused', return_to_base: 'returning', dock: 'returning' }[service];
    if (cur && robot && (domain === 'vacuum' || domain === 'lawn_mower')) { set(data.entity_id, robot); if (ROBOT_SEL[data.entity_id]) ROBOT_SEL[data.entity_id].value = robot; refresh(); }
  },
});
const refresh = () => { const h = hass(); cards.forEach((c) => (c.hass = h)); };

/* ---------- control widgets ---------- */
const T_ = (fr, en) => (lang === 'fr' ? fr : en);
function range(ctl, label, id, min, max, step, val, unit, attrs, fmt) {
  set(id, val, attrs);
  const lab = document.createElement('label'); lab.textContent = label;
  const inp = Object.assign(document.createElement('input'), { type: 'range', min, max, step, value: val });
  const out = document.createElement('output');
  const show = () => (out.textContent = fmt ? fmt(+inp.value) : `${inp.value} ${unit}`);
  inp.oninput = () => { set(id, inp.value); show(); refresh(); };
  show(); ctl.append(lab, inp, out);
}
function select(ctl, label, id, options, val, onChange) {
  set(id, val);
  const lab = document.createElement('label'); lab.textContent = label;
  const sel = document.createElement('select');
  options.forEach(([v, t]) => sel.append(new Option(t, v, false, v === val)));
  sel.onchange = () => { set(id, sel.value); onChange && onChange(sel.value); refresh(); };
  ctl.append(lab, sel, document.createElement('span'));
  return sel;
}
function checks(ctl, items) {
  const wrap = document.createElement('div'); wrap.className = 'chk';
  ctl.append(document.createElement('span'), wrap);
  items.forEach(([label, id, val]) => {
    set(id, val ? 'on' : 'off');
    const l = document.createElement('label');
    const c = Object.assign(document.createElement('input'), { type: 'checkbox', checked: !!val });
    c.onchange = () => { set(id, c.checked ? 'on' : 'off'); refresh(); };
    states[id]._input = c;
    l.append(c, label); wrap.append(l);
  });
}
const mmss = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;

/* ---------- appliance scenarios ---------- */
const CYCLE = [
  ['off', 'Arrêt / Off'], ['Lavage', 'Lavage / Wash'], ['Rinçage', 'Rinçage / Rinse'], ['Essorage', 'Essorage / Spin'],
  ['finished', 'Terminé / Finished'], ['unavailable', 'Indisponible'],
];
const SCEN = [
  { kind: 'washer', title: 'Lave-linge', p: 'washer',

    build(ctl) {
      select(ctl, 'État', 'sensor.washer_status', CYCLE, 'Lavage');

      set('sensor.washer_energy', 1.42, KWH); set('sensor.washer_cost', 0.31, EUR);
      checks(ctl, [['Porte ouverte', 'binary_sensor.washer_door', false]]);
    } },
  { kind: 'dryer', title: 'Sèche-linge',

    build(ctl) {

      range(ctl, 'Puissance', 'sensor.dryer_power', 0, 2800, 10, 2300, 'W', W);
      range(ctl, 'Restant', 'sensor.dryer_remaining', 0, 180, 1, 64, 'min', { unit_of_measurement: 'min' });
      set('sensor.dryer_energy', 2.1, KWH);
    } },

      range(ctl, 'Puissance', 'sensor.dishwasher_power', 0, 2200, 10, 1900, 'W', W);
      range(ctl, 'Restant', 'sensor.dishwasher_remaining', 0, 240, 1, 72, 'min', { unit_of_measurement: 'min' });

    build(ctl) {

      ctl.append(Object.assign(document.createElement('span'), { textContent: '' }), Object.assign(document.createElement('span'), { textContent: 'Bouton ⏻ de la carte = interrupteur', style: 'color:var(--secondary-text-color);font-size:12px' }), document.createElement('span'));
    } },
  { kind: 'oven', title: 'Four',

      range(ctl, 'Température', 'sensor.oven_temp', 20, 250, 1, 140, '°C', T);
      range(ctl, 'Consigne', 'sensor.oven_target', 50, 250, 5, 180, '°C', T);
      checks(ctl, [['Porte ouverte', 'binary_sensor.oven_door', false]]);
    } },
  { kind: 'microwave', title: 'Micro-ondes',
    cfg: { power: 'sensor.microwave_power', remaining: 'sensor.microwave_remaining', door: 'binary_sensor.microwave_door' },
    build(ctl) {
      range(ctl, 'Puissance', 'sensor.microwave_power', 0, 1200, 10, 900, 'W', W);
      range(ctl, 'Restant', 'sensor.microwave_remaining', 0, 600, 5, 105, 's', { unit_of_measurement: 's' }, mmss);
      checks(ctl, [['Porte ouverte', 'binary_sensor.microwave_door', false]]);
    } },
  { kind: 'air-fryer', title: 'Airfryer',
    cfg: { entity: 'switch.airfryer', power: 'sensor.airfryer_power', remaining: 'sensor.airfryer_remaining', energy: 'sensor.airfryer_energy', cost: 'sensor.airfryer_cost' },
    build(ctl) {
      set('switch.airfryer', 'on');

      set('sensor.airfryer_energy', 0.42, KWH);
      set('sensor.airfryer_cost', 0.09, { unit_of_measurement: '€', device_class: 'monetary' });
    } },
  { kind: 'coffee-maker', title: 'Cafetière (filtre)',
    cfg: { entity: 'switch.coffee', power: 'sensor.coffee_power', energy: 'sensor.coffee_energy', style: 'filtre' },
    build(ctl) {
      set('switch.coffee', 'on');
      range(ctl, 'Puissance', 'sensor.coffee_power', 0, 1500, 10, 950, 'W', W);

    } },
  { kind: 'coffee-maker', title: 'Cafetière (dosettes)',
    cfg: { power: 'sensor.pod_power', style: 'dosette' },

  { kind: 'tv', title: 'Téléviseur',

  { kind: 'range-hood', title: 'Hotte aspirante',

    build(ctl) {
      range(ctl, 'Puissance', 'sensor.hood_power', 0, 300, 1, 80, 'W', W);

    } },
  { kind: 'towel-dryer', title: 'Sèche-serviettes',
    cfg: { switch: 'switch.towel', power: 'sensor.towel_power', mode: 'select.towel_mode', temperature: 'sensor.bathroom_temp', target_temperature: 'sensor.towel_target', energy: 'sensor.towel_energy' },

      select(ctl, 'Mode', 'select.towel_mode', [['confort', 'Confort'], ['eco', 'Éco'], ['hors-gel', 'Hors-gel'], ['arret', 'Arrêt']], 'confort');
      states['select.towel_mode'].attributes = { options: ['Confort', 'Eco', 'Hors-gel', 'Arrêt'] };
      range(ctl, 'Puissance', 'sensor.towel_power', 0, 1000, 10, 500, 'W', W);

      range(ctl, 'Consigne', 'sensor.towel_target', 15, 30, 0.5, 22, '°C', T);

const scenCfg = (s) => ({ ...s.cfg, ...(s.lang ? { language: lang } : {}), ...(animations ? {} : { animations: false }) });
const toYaml = (kind, cfg) => [`type: custom:appliance-${kind}-card`, ...Object.entries(cfg).map(([k, v]) => `${k}: ${v}`)].join('\n');

function buildAll() {
  const main = document.getElementById('main');
  main.innerHTML = ''; cards.length = 0;
  for (const s of SCEN) {
    const cell = document.createElement('div'); cell.className = 'cell';
    const ctl = document.createElement('div'); ctl.className = 'ctl';
    ctl.innerHTML = `<h3>${s.title} — commandes simulées</h3>`;
    s.build(ctl);
    const cfg = scenCfg(s);
    const yaml = document.createElement('details'); yaml.className = 'yaml';
    yaml.innerHTML = `<summary>Voir le YAML</summary><pre>${toYaml(s.kind, cfg)}</pre>`;
    ctl.append(yaml);
    const el = document.createElement(`appliance-${s.kind}-card`);
    el.setConfig(cfg); el._scen = s;
    el.addEventListener('hass-more-info', (e) => log(`more-info ${e.detail.entityId}`));
    cards.push(el);
    cell.append(el, ctl); main.append(cell);
  }
  refresh();
}

function seg(id, cb) {
  const root = document.getElementById(id);
  root.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    root.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
    cb(b.dataset.v);
  });
}
// Langues disponibles = fichiers src/i18n/<lang>.json, lus dans l'option `language` de l'éditeur d'une carte autonome
const LANGS = (() => {
  const form = customElements.get('appliance-linky-card')?.getConfigForm?.();
  const opt = form && form.schema.find((i) => i.name === 'language');
  return opt ? opt.selector.select.options.map((o) => o.value || o) : ['fr', 'en'];
})();
const langName = (l) => { try { return new Intl.DisplayNames([l], { type: 'language' }).of(l); } catch (e) { return l; } };
LANGS.forEach((l) => {
  const b = Object.assign(document.createElement('button'), { textContent: l.toUpperCase(), title: langName(l), className: l === lang ? 'on' : '' });
  b.dataset.v = l; document.getElementById('lang').append(b);
});
seg('theme', (v) => document.body.classList.toggle('light', v === 'light'));
seg('lang', (v) => { lang = v; document.documentElement.lang = v; cards.forEach((el) => el._scen.lang && el.setConfig(scenCfg(el._scen))); refresh(); });
seg('anim', (v) => { animations = v === '1'; buildAll(); });
buildAll();
const ver = window.customCards ? `${window.customCards.length} cartes chargées` : 'erreur de chargement';
document.getElementById('ver').textContent += ` · ${ver}`;
</script>
